name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Install dev/test dependencies
        run: pip install -r requirements-dev.txt

      - name: Syntax check
        run: |
          python -m py_compile \
            src/data/database.py \
            src/data/models.py \
            src/search/query.py \
            src/web/app.py \
            config.py

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --tb=short -x
        env:
          PYTEST_CURRENT_TEST: "true"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check src/ --select=E,F,W --ignore=E501,F401,F811,F403 || true
