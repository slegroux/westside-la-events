[pytest]
# Pytest configuration for LA Events Aggregator

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    -p no:rostest
    -p no:launch_testing
    -p no:launch_testing_ros

# Markers for organizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for system components
    scraper: Tests for web scrapers
    e2e: End-to-end tests with Playwright
    slow: Tests that take longer to run
    requires_network: Tests that require network access
    requires_db: Tests that require database
    requires_api: Tests that require external API keys
    asyncio: Async tests using asyncio

# Asyncio configuration
asyncio_mode = auto

# Ignore paths
norecursedirs = .git .tox dist build *.egg data logs static
